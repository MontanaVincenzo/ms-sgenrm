data_generation:
  asr_model: "nvidia/canary-1b-v2"
  llm_model: "Qwen/Qwen3.6-35B-A3B-FP8"
  tts_model: "Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign"
  data_dir: "data"

  perturb_input: true
  input_request_output_file: "dataset.jsonl"
  asr_output_file: "dataset_asr.jsonl"
  llm_output_file: "dataset_llm.jsonl"
  tts_output_file: "dataset_tts.jsonl"
  final_output_file: "dataset_eval.jsonl"
  votes_output_file: "dataset_eval_votes.jsonl"      # raw judge votes (05_llm_evaluation/evaluate.py)
  agreement_output_file: "agreement_stats.json"      # judge self-consistency (05_llm_evaluation/agreement.py)

  # 06_split_data: whole topics are assigned to one split; fractions must sum to 1
  split:
    seed: 0
    train_frac: 0.80
    eval_frac: 0.15
    val_frac: 0.05
    train_file: "train_data.jsonl"
    eval_file: "eval_data.jsonl"
    val_file: "val_data.jsonl"

bradley_terry:
  seed: 42
  output_path: "reward_model/bradley_terry/results/checkpoints"
  eval_output_file: "reward_model/bradley_terry/results/evaluation.json"  # written by evaluate.py
  gradient_accumulation_steps: 1
  num_workers: 4
  num_epochs: 3
  lr: 1e-4
  warmup_steps: 25
  model_id: "Qwen/Qwen2.5-Omni-7B"
  batch_size: 16
  label_smoothing: 0.1

generative_rm:
  model_id: "Qwen/Qwen2.5-Omni-7B"
  level: "C"            # A = overall_score, B = A + overall_notes, C = B + per-stage + error propagation
  output_dir: "reward_model/generative_rm/qwen-omni-thinker-sft"  # "-level<LEVEL>" is appended
  epochs: 1.0
  per_device_batch_size: 2
  grad_accum: 4
  learning_rate: 1.0e-4
  warmup_steps: 10
  seed: 0
  use_wandb: true
  wandb_project: "src"
  run_name: null        # null -> output_dir basename
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
  # convert_adapter_for_vllm.py: output_dir-level<LEVEL> -> vllm_adapter_dir-level<LEVEL>
  vllm_adapter_dir: "reward_model/generative_rm/qwen-omni-thinker-sft-vllm"
  eval:                 # eval.py (vLLM)
    split: "eval"       # which data_generation.split file to evaluate on: train | eval | val
    results_dir: "reward_model/generative_rm/results"   # writes <split>_level<LEVEL>.jsonl + _stats.json
    max_new_tokens: 2048
    max_model_len: 8192
    max_num_seqs: 16
    gpu_memory_utilization: 0.85
    device: "cuda:0"
    seed: 0

  